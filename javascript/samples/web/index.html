<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Realtime API with openai-node SDK</title>
</head>

<body>
  <div id="app">
    <form>
      <div class="container">
        <div id="received-text-container"></div>
        <div class="controls">
          <div class="input-group">
          <div class="button-group">
            <button id="start-recording" type="button">Record</button>
            <button id="stop-recording" type="button" disabled="true">Stop</button>
          </div>
          <div class="input-group">
            <label for="session-instructions">System Message</label>
            <textarea id="session-instructions" placeholder="Optional instructions for the session, e.g. 'You talk like a pirate.'" rows="4"></textarea>
          </div>
          <div class="input-group">
            <label for="temperature">Temperature</label>
            <input id="temperature" type="number" min="0.6" max="1.2" step="0.05" placeholder="0.6-1.2 (default 0.8)"/>
          </div>
          <div class="input-group">
            <label for="voice">Voice</label>
              <select id="voice">
                <option></option>
                <option>alloy</option>
                <option>ash</option>
                <option>ballad</option>
                <option>coral</option>
                <option>echo</option>
                <option>sage</option>
                <option>shimmer</option>
                <option>verse</option>
              </select>
          </div>
          <!-- Product Topic dropdown -->
          <div class="input-group">
            <label for="product-topic">Product</label>
            <select id="product-topic">
              <option value=""></option>
            </select>
          </div>
          <div class="button-group">
            <button id="clear-all" type="button">Clear all</button>
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- Session Analysis Modal -->
  <div id="analysis-modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close="true"></div>
    <div class="modal-content" role="document">
      <div class="modal-header">
        <h2 class="modal-title">Session Summary & Insights</h2>
        <button id="close-modal" type="button" class="icon-btn" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-actions">
          <button id="analyze-transcript" type="button">Analyze Transcript</button>
          <button id="clear-display" type="button" class="secondary">Clear Display</button>
        </div>
        <section id="insights-section">
          <h3>Insights</h3>
          <div id="insights-loading" class="hidden">Analyzing transcript...</div>
          <div id="insights-error" class="error hidden"></div>
          <div id="insights-output" class="insights-output"></div>
        </section>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
